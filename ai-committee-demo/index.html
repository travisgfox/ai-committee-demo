<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI tools in my classes — Curriculum Committee</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .deck{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;}
  .slide{position:absolute;inset:0;display:none;}
  .slide.on{display:block;}

  /* screenshots: shown at their actual size, centered; shrink only if the window is smaller */
  .shot.on{display:flex;align-items:center;justify-content:center;}
  .shot img{display:block;max-width:none;}

  /* one section of a live site, shifted into view */
  .section{overflow:hidden;}
  .section iframe{position:absolute;left:0;top:0;width:1280px;height:8400px;border:0;transform-origin:0 0;background:#f4f3ef;}

  /* full live site, actual size, fills the window */
  .site{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:none;z-index:2;background:#fff;}
  .site.on{display:block;}

  /* nav: invisible until hovered */
  .nav{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;z-index:5;opacity:.5;transition:opacity .2s;}
  .nav:hover{opacity:1;}
  .nav button{font:20px ui-monospace,Menlo,monospace;background:#2a2a30;color:#eee;border:0;padding:8px 12px;cursor:pointer;border-radius:3px;}
  .nav span{font:13px ui-monospace,Menlo,monospace;color:#aaa;padding:8px 6px;background:#2a2a30;border-radius:3px;}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">
<section class="slide fullsite" data-src="https://fundamentals.travisfox.com/" data-title="Fundamentals syllabus"></section>
<section class="slide shot" style="background:#ffffff"><img src="img/06-drive.jpg" data-dpr="2" alt="CUNY Google Drive assignment folder, names replaced"></section>
<section class="slide shot" style="background:#000000"><img src="img/10-reviewatron.jpg" alt="Newmark Video Review-a-Tron"></section>
<section class="slide shot" style="background:#000000"><img src="img/11-pitch.jpg" data-dpr="2" alt="Review-a-Tron: pitch"></section>
<section class="slide shot" style="background:#000000"><img src="img/12-rough.jpg" data-dpr="2" alt="Review-a-Tron: rough cut"></section>
<section class="slide shot" style="background:#ffffff"><img src="img/15-email.jpg" data-dpr="2" alt="Feedback email to student, names replaced"></section>
<section class="slide shot" style="background:#000000"><img src="img/14-ai-summary.jpg" data-dpr="2" alt="Review-a-Tron: AI summary of video feedback"></section>
<section class="slide shot" style="background:#ffffff"><img src="img/09a-house.jpg" alt="Script writing: build the foundation, then the house"></section>
<section class="slide shot" style="background:#ffffff"><img src="img/09b-timeline.jpg" alt="Script writing: same house, in the timeline"></section>
<section class="slide shot" style="background:#f4f3ef"><img src="img/08-sequence.jpg" alt="Sequencing slide: five shots from The Town of Lonely Dentists"></section>
</div></div>
<div class="nav"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button><button id="fs" aria-label="Full screen">⛶</button></div>

<script>
(function(){
  var deck = document.getElementById('deck');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var i = 0, s = 1;

  // Full-site slides get a window-sized iframe outside the scaled deck, so the page renders at actual size.
  slides.forEach(function(sl){
    if (!sl.classList.contains('fullsite')) return;
    var f = document.createElement('iframe');
    f.className = 'site'; f.src = sl.dataset.src; f.title = sl.dataset.title || '';
    document.body.appendChild(f); sl._site = f;
  });

  function sizeShots(){
    document.querySelectorAll('.shot img').forEach(function(im){
      var d = +(im.dataset.dpr || 1), w = im.naturalWidth / d, h = im.naturalHeight / d;
      if (!w) { im.onload = sizeShots; return; }
      var k = Math.min(1, window.innerWidth / w, window.innerHeight / h);
      im.style.width = (w * k / s) + 'px'; im.style.height = (h * k / s) + 'px';
    });
  }
  function fit(){
    s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    deck.style.transform = 'scale(' + s + ')';
    sizeShots();
  }
  function show(n){
    i = Math.max(0, Math.min(slides.length-1, n));
    slides.forEach(function(sl, k){
      var on = k === i; sl.classList.toggle('on', on);
      if (sl._site) sl._site.classList.toggle('on', on);
    });
    document.getElementById('count').textContent = (i+1) + ' / ' + slides.length;
    try { history.replaceState(null, '', '#' + (i+1)); } catch(e){}
    window.focus();
  }
  var start = parseInt((location.hash || '').slice(1), 10);
  fit(); window.addEventListener('resize', fit);
  show(isNaN(start) ? 0 : start - 1);
  document.addEventListener('keydown', function(e){
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(i+1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i-1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length-1);
    if (e.key === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); else document.exitFullscreen(); }
  });
  document.getElementById('prev').onclick = function(){ show(i-1); };
  document.getElementById('next').onclick = function(){ show(i+1); };
  document.getElementById('fs').onclick = function(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); else document.exitFullscreen(); };
})();
</script>
</body>
</html>
